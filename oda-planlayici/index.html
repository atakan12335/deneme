<title>Genç Odası Planı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting-table app — library + list on the left, plan and 3D model in the middle, inspector on the right */
:root {
  --bg: #e7ebef;
  --surface: #f7f9fa;
  --panel: #ffffff;
  --ink: #17202a;
  --muted: #5a6876;
  --line: #d2d9e0;
  --accent: #2752c9;
  --accent-soft: #e3eafb;
  --accent-ink: #ffffff;
  --sel: #e9a514;
  --warn: #c8402b;
  --warn-soft: #fbe9e5;
  --ok: #2b7d50;
  --grid: #e2e7ec;
  --grid-major: #c9d1d9;
  --wall: #26303b;
  --floor: #fbfcfd;
  --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419; --surface: #151b22; --panel: #1a2129; --ink: #e5eaef; --muted: #93a1af;
    --line: #2a343f; --accent: #7397ff; --accent-soft: #1d2840; --accent-ink: #0b1020;
    --sel: #f4c04e; --warn: #ff7c66; --warn-soft: #3a1f1b; --ok: #5cc58a;
    --grid: #1c242c; --grid-major: #2b3540; --wall: #c5cfd9; --floor: #121820;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419; --surface: #151b22; --panel: #1a2129; --ink: #e5eaef; --muted: #93a1af;
  --line: #2a343f; --accent: #7397ff; --accent-soft: #1d2840; --accent-ink: #0b1020;
  --sel: #f4c04e; --warn: #ff7c66; --warn-soft: #3a1f1b; --ok: #5cc58a;
  --grid: #1c242c; --grid-major: #2b3540; --wall: #c5cfd9; --floor: #121820;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr) 300px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "bar bar bar" "side stage insp";
}

/* top bar */
.bar {
  grid-area: bar;
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px;
  padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dims-chip { font-size: 12px; color: var(--muted); }
.bar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.scene-pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.scene-pick select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-weight: 600; max-width: 220px; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"]::before { background: var(--ok); }
.sync[data-s="saving"]::before { background: var(--sel); }
.sync[data-s="ro"]::before, .sync[data-s="err"]::before { background: var(--warn); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px;
  padding: 5px 11px; cursor: pointer; font-size: 13px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--warn); }
.btn.danger.armed { background: var(--warn); border-color: var(--warn); color: var(--panel); }
.btn.small { padding: 3px 8px; font-size: 12px; }

/* side + inspector panels */
.side, .insp {
  background: var(--panel); overflow-y: auto; min-height: 0;
  padding: 14px 16px 24px;
  display: flex; flex-direction: column; gap: 20px;
}
.side { grid-area: side; border-right: 1px solid var(--line); }
.insp { grid-area: insp; border-left: 1px solid var(--line); }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.side h2.eyebrow { display: flex; justify-content: space-between; }

.lib { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.lib button {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
  padding: 6px 8px; cursor: pointer; text-align: left; min-width: 0;
}
.lib button:hover { border-color: var(--accent); }
.lib button span:first-child { font-size: 12.5px; font-weight: 500; line-height: 1.25; }
.lib button span:last-child { font-size: 10.5px; color: var(--muted); }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.list button {
  width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 6px 6px; cursor: pointer; text-align: left;
}
.list button:hover { background: var(--surface); }
.list button[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); }
.list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.list .dm { display: block; font-size: 10.5px; color: var(--muted); }
.chip { font-size: 10.5px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.urun { border-color: var(--ok); color: var(--ok); }
.chip.var { border-color: var(--accent); color: var(--accent); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
.empty { font-size: 13px; color: var(--muted); margin: 0; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin: 0; }
.stats div { min-width: 0; }
.stats dt { font-size: 11px; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.shop { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.shop li { display: flex; justify-content: space-between; gap: 8px; }
.shop a { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* stage */
.stage { grid-area: stage; min-width: 0; min-height: 0; padding: 12px; container-type: inline-size; }
.views { height: 100%; display: grid; gap: 12px; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); }
.views[data-view="plan"], .views[data-view="3d"] { grid-template-columns: 1fr; }
.views[data-view="plan"] #pane3d, .views[data-view="3d"] #pane2d { display: none; }
@container (max-width: 820px) {
  .views[data-view="both"] { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
}
.pane {
  position: relative; min-width: 0; min-height: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  display: flex; flex-direction: column;
}
.pane-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted);
}
.pane-head strong { color: var(--ink); font-weight: 600; }
.pane-body { position: relative; flex: 1; min-height: 0; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
#three { position: absolute; inset: 0; }
#three canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.pane-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); margin: 0; }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: var(--muted); pointer-events: none; background: var(--surface); padding: 2px 6px; border-radius: 4px; }

/* plan svg */
.floor { fill: var(--floor); }
.g-minor { fill: none; stroke: var(--grid); }
.g-major { fill: none; stroke: var(--grid-major); }
.wall { fill: var(--wall); }
.win-line { stroke: var(--wall); fill: none; }
.win-fill { fill: var(--surface); }
.door-leaf { stroke: var(--wall); fill: none; }
.door-arc { stroke: var(--muted); fill: none; stroke-dasharray: 3 3; }
.door-zone { fill: var(--accent); opacity: 0.06; }
.dim { fill: var(--muted); font-family: var(--font-mono); }
.dim-line { stroke: var(--muted); }
.item { cursor: grab; }
.item .body { stroke: var(--ink); stroke-opacity: 0.55; }
.item.rug .body { fill-opacity: 0.45; stroke-dasharray: 6 4; }
.item.wallmount .body { stroke-dasharray: 3 2; fill-opacity: 0.7; }
.item .detail { fill: none; stroke: var(--ink); stroke-opacity: 0.4; }
.item .detail-fill { fill: #ffffff; fill-opacity: 0.75; stroke: var(--ink); stroke-opacity: 0.35; }
.item .front { stroke: var(--ink); stroke-opacity: 0.8; }
.item.warn .body { stroke: var(--warn); stroke-opacity: 1; }
.item.sel .body { stroke: var(--sel); stroke-opacity: 1; }
.item.dragging { cursor: grabbing; }
.lbl { fill: var(--ink); font-family: var(--font-ui); pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-linejoin: round; }
.lbl .sub { fill: var(--muted); font-family: var(--font-mono); }
.measure { stroke: var(--sel); stroke-dasharray: 4 3; }
.measure-lbl { fill: var(--ink); font-family: var(--font-mono); paint-order: stroke; stroke: var(--surface); stroke-linejoin: round; pointer-events: none; }

/* inspector */
.insp h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.insp h3 { margin: 4px 0 0; font-size: 13px; font-weight: 600; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.form { display: flex; flex-direction: column; gap: 12px; }
.row { display: grid; gap: 8px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label, .field .lab { font-size: 11.5px; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
}
.field input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.field input[type="color"] { padding: 2px; height: 32px; cursor: pointer; }
.field textarea { resize: vertical; min-height: 56px; }
.field input:disabled, .field select:disabled, .field textarea:disabled { opacity: 0.6; }
.rot { display: flex; gap: 6px; }
.rot input { flex: 1; }
.linkrow { display: flex; gap: 6px; }
.linkrow input { flex: 1; }
.linkrow a { align-self: center; font-size: 12.5px; color: var(--accent); white-space: nowrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.warns { list-style: none; margin: 0; padding: 8px 10px; border-radius: 7px; background: var(--warn-soft); color: var(--warn); font-size: 12.5px; display: flex; flex-direction: column; gap: 3px; }
.op { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.op-head { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 600; }
.op .field input, .op .field select { background: var(--panel); }
.howto { font-size: 12.5px; color: var(--muted); margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px;
  max-width: calc(100% - 32px); z-index: 10; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 220px minmax(0, 1fr) 270px; }
}
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { display: flex; flex-direction: column; height: auto; }
  .bar { order: 0; }
  .stage { order: 1; height: auto; }
  .views { height: auto; }
  .views[data-view="both"] { grid-template-columns: 1fr; grid-template-rows: none; }
  .pane { height: 62vh; min-height: 320px; }
  .insp { order: 2; border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .side { order: 3; border-right: 0; border-top: 1px solid var(--line); overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Genç Odası Planı</h1>
      <span class="dims-chip mono" id="roomChip">330 × 400 cm · tavan 260</span>
    </div>
    <div class="scene-pick">
      <label for="scene" class="eyebrow" style="margin:0">Plan</label>
      <select id="scene"></select>
      <button type="button" class="btn" id="btnScene">+ Taslak oluştur</button>
    </div>
    <div class="bar-actions">
      <div class="seg" role="group" aria-label="Görünüm">
        <button type="button" data-view="plan" aria-pressed="false">Plan</button>
        <button type="button" data-view="3d" aria-pressed="false">3D</button>
        <button type="button" data-view="both" aria-pressed="true">İkisi</button>
      </div>
      <button type="button" class="btn" id="btnRoom">Oda ölçüleri</button>
      <button type="button" class="btn" id="btnCopy">Planı kopyala</button>
      <span class="sync" id="sync" data-s="">Bağlanıyor…</span>
    </div>
  </header>

  <aside class="side" aria-label="Eşyalar">
    <section>
      <h2 class="eyebrow">Eşya ekle</h2>
      <div class="lib" id="lib"></div>
    </section>
    <section>
      <h2 class="eyebrow"><span>Odadakiler</span><span id="count" class="mono"></span></h2>
      <ul class="list" id="list"></ul>
    </section>
    <section>
      <h2 class="eyebrow">Özet</h2>
      <dl class="stats" id="stats"></dl>
      <ul class="shop" id="shop"></ul>
    </section>
  </aside>

  <main class="stage">
    <div class="views" id="views" data-view="both">
      <section class="pane" id="pane2d" aria-label="Plan görünümü">
        <div class="pane-head"><strong>Plan · üstten</strong><span class="mono">ızgara 10 / 50 cm</span></div>
        <div class="pane-body">
          <svg id="plan" role="img" aria-label="Odanın üstten planı"></svg>
          <div class="hint">Sürükle: taşı · R: 90° döndür · oklar: 1 cm (Shift: 10 cm)</div>
        </div>
      </section>
      <section class="pane" id="pane3d" aria-label="3D görünüm">
        <div class="pane-head">
          <strong>3D</strong>
          <div class="seg" role="group" aria-label="Kamera">
            <button type="button" data-cam="genel" aria-pressed="true">Genel</button>
            <button type="button" data-cam="ust" aria-pressed="false">Üstten</button>
            <button type="button" data-cam="kapi" aria-pressed="false">Kapıdan</button>
          </div>
        </div>
        <div class="pane-body"><div id="three"></div></div>
      </section>
    </div>
  </main>

  <aside class="insp" id="insp" aria-label="Ayrıntılar"></aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
"use strict";

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, d) => { const n = parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : d; };
const r1 = (v) => Math.round(v * 10) / 10;
const fmt = (v) => String(r1(v)).replace(".", ",");
const newId = () => "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const tl = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 0 });

/* ---------- catalogue (cm) ---------- */
const KINDS = {
  yatak:    { label: "Yatak",          w: 120, d: 200, h: 90,  color: "#7d93c4" },
  masa:     { label: "Çalışma masası", w: 120, d: 60,  h: 75,  color: "#c9a77c" },
  sandalye: { label: "Sandalye",       w: 60,  d: 60,  h: 110, color: "#3d4656" },
  gardirop: { label: "Gardırop",       w: 150, d: 60,  h: 210, color: "#e2dfd8" },
  kitaplik: { label: "Kitaplık",       w: 80,  d: 30,  h: 180, color: "#d8cbb5" },
  komodin:  { label: "Komodin",        w: 45,  d: 40,  h: 50,  color: "#d8cbb5" },
  hali:     { label: "Halı",           w: 160, d: 230, h: 1,   color: "#8fb39a" },
  koltuk:   { label: "Koltuk / puf",   w: 80,  d: 80,  h: 75,  color: "#d9785e" },
  tv:       { label: "TV ünitesi",     w: 140, d: 40,  h: 50,  color: "#5b5f66" },
  raf:      { label: "Duvar rafı",     w: 80,  d: 22,  h: 4,   color: "#d8cbb5", elev: 140 },
  lamba:    { label: "Lambader",       w: 35,  d: 35,  h: 160, color: "#2b2f36" },
  petek:    { label: "Kalorifer peteği", w: 100, d: 10, h: 60, color: "#f1f1ee", elev: 12 },
  ekran:    { label: "Duvar TV / ekran", w: 219, d: 8, h: 126, color: "#121418", elev: 60 },
  camdolap: { label: "Işıklı cam gardırop", w: 200, d: 60, h: 200, color: "#1b1d22" },
  kask:     { label: "Kask (duvarda)", w: 30, d: 35, h: 30, color: "#2b2f36", elev: 160 },
  kutu:     { label: "Diğer",          w: 50,  d: 50,  h: 50,  color: "#a3a9b3" },
};
const WALLS = { ust: "Üst duvar", alt: "Alt duvar", sol: "Sol duvar", sag: "Sağ duvar" };
const DEFAULT_ROOM = { w: 330, l: 400, h: 260, wallColor: "#e6e4ee", floorColor: "#c49a6c", openings: [] };
const SAMPLE = {
  room: { w: 330, l: 400, h: 260, wallColor: "#e6e4ee", floorColor: "#c49a6c", openings: [
    { id: "o1", type: "kapi", wall: "alt", offset: 20, width: 85, height: 205, hinge: "a" },
    { id: "o2", type: "pencere", wall: "ust", offset: 150, width: 140, height: 130, sill: 90 },
  ] },
  items: [
    { id: "s1", kind: "yatak", name: "Yatak (örnek)", w: 120, d: 200, h: 90, x: 60, y: 100, rot: 0 },
    { id: "s2", kind: "komodin", name: "Komodin (örnek)", w: 45, d: 40, h: 50, x: 142.5, y: 20, rot: 0 },
    { id: "s3", kind: "masa", name: "Masa (örnek)", w: 120, d: 60, h: 75, x: 240, y: 30, rot: 0 },
    { id: "s4", kind: "sandalye", name: "Sandalye (örnek)", w: 60, d: 60, h: 110, x: 240, y: 95, rot: 180 },
    { id: "s5", kind: "gardirop", name: "Gardırop (örnek)", w: 150, d: 60, h: 210, x: 300, y: 300, rot: 90 },
    { id: "s6", kind: "hali", name: "Halı (örnek)", w: 120, d: 170, h: 1, x: 190, y: 225, rot: 0 },
  ],
};

/* ---------- state ---------- */
const state = {
  room: normRoom(DEFAULT_ROOM),
  items: new Map(),
  sel: null,
  view: "both",
  mode: "loading", // loading | db | local
  scene: "mevcut",
  scenes: [{ id: "mevcut", name: "Şu anki hali" }],
  readOnly: false,
};
let db = null;
let preferredScene = null; // the viewer's last plan, applied once the plan list has loaded
const rememberScene = (id) => { try { localStorage.setItem("genc-odasi-plan-v1-scene", id); } catch (e) { /* ignore */ } };
const applyPreferred = () => { pickScene(preferredScene || state.scene); preferredScene = null; };
let dragId = null;

function normRoom(r) {
  r = r || {};
  return {
    w: clamp(num(r.w, 330), 50, 2000), l: clamp(num(r.l, 400), 50, 2000), h: clamp(num(r.h, 260), 150, 600),

const sortedItems = () => [...state.items.values()].filter((i) => i.scene === state.scene).sort((a, b) => a.created - b.created || a.id.localeCompare(b.id));

/* ---------- geometry ---------- */
function corners(it) {

function polyOverlap(A, B) {
  for (const P of [A, B]) {

      for (const [x, y] of A) { const p = x * nx + y * ny; a0 = Math.min(a0, p); a1 = Math.max(a1, p); }
      for (const [x, y] of B) { const p = x * nx + y * ny; b0 = Math.min(b0, p); b1 = Math.max(b1, p); }
      const len = Math.hypot(nx, ny) || 1;
      if (a1 <= b0 + 0.5 * len || b1 <= a0 + 0.5 * len) return false;
    }

}
const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
function wallFrame(wall) {

    ust: { o: [0, 0], a: [1, 0], n: [0, 1], len: W },
    alt: { o: [0, L], a: [1, 0], n: [0, -1], len: W },
    sol: { o: [0, 0], a: [0, 1], n: [1, 0], len: L },

function computeWarnings() {
  const { w: W, l: L } = state.room;
  const out = new Map();
  const add = (id, m) => { if (!out.has(id)) out.set(id, []); if (!out.get(id).includes(m)) out.get(id).push(m); };
  const items = sortedItems();
  const polys = new Map(items.map((it) => [it.id, corners(it)]));
  const doors = state.room.openings.filter((o) => o.type === "kapi" && o.swing !== "dis");
  for (const it of items) {
    const b = bbox(polys.get(it.id));
    if (b.x0 < -0.5 || b.y0 < -0.5 || b.x1 > W + 0.5 || b.y1 > L + 0.5) add(it.id, "Oda sınırının dışına taşıyor");
    if (it.elev + it.h > state.room.h + 0.5) add(it.id, "Tavandan yüksek");
  }
  for (let i = 0; i < items.length; i++) {
    const A = items[i]; if (A.kind === "hali") continue;
    for (let j = i + 1; j < items.length; j++) {
      const B = items[j]; if (B.kind === "hali") continue;
      const vOverlap = A.elev < B.elev + B.h - 0.5 && B.elev < A.elev + A.h - 0.5;
      if (!vOverlap) continue;
      if (polyOverlap(polys.get(A.id), polys.get(B.id))) {

/* ---------- storage ---------- */
const LS_KEY = "genc-odasi-plan-v1";

  setSync();
}
function flush(key) {

  const p = prev.then(() => write(key));
  chains.set(key, p);
  p.finally(() => {
    if (chains.get(key) === p) { chains.delete(key); if (!timers.has(key)) dirty.delete(key); }

}
async function write(key) {

    if (state.mode === "db" && db) {
      if (key === "room") await db.doc("plan/oda").set(JSON.parse(JSON.stringify(state.room)));
      else if (key === "scenes") await db.doc("plan/sahneler").set({ list: state.scenes.filter((x) => x.id !== "mevcut") });
      else {
        const id = key.slice(5), it = state.items.get(id), ref = db.doc("esyalar/" + id);
        if (it) await ref.set(JSON.parse(JSON.stringify(plain(it)))); else await ref.delete();
      }
    } else if (state.mode === "local") {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ room: state.room, scenes: state.scenes, items: [...state.items.values()] })); } catch (e) { /* storage blocked */ }
    }
    lastErr = false;
  } catch (e) {
    lastErr = true;
    if (e && e.code === "invalid_argument") {
      state.readOnly = true; renderInspector(); toast("Bu planı düzenleme iznin yok, değişiklikler kaydedilmedi.");
    } else if (e && e.code === "quota_exceeded") {
      toast("Plan deposu doldu. Birkaç eşyayı silip tekrar dene.");
    } else {

    }

}
function setSync() {

  else if (state.mode === "db") {
    if (state.readOnly) { s = "ro"; t = "Yalnızca görüntüleme"; }
    else if (dirty.size) { s = "saving"; t = "Kaydediliyor…"; }
    else if (lastErr) { s = "err"; t = "Kaydedilemedi"; }
    else { s = "ok"; t = "Kaydedildi · ortak plan"; }
  }
  el.dataset.s = s; el.textContent = t;
}

function startLocal() {
  state.mode = "local";
  let data = null;
  try { data = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { data = null; }
  if (!data) data = SAMPLE;
  state.room = normRoom(data.room);
  state.items = new Map((data.items || []).map((o, i) => [String(o.id), normItem(String(o.id), { created: i, ...o })]));
  state.scenes = normScenes(data.scenes);
  applyPreferred();
  setSync(); renderAll();
}

async function startStore() {
  let user = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { startLocal(); return; }
  state.mode = "db";
  try { user = await window.claude.use("user"); } catch (e) { user = null; }
  if (user && user.can) { try { if ((await user.can("data.write")) === false) state.readOnly = true; } catch (e) { /* unknown */ } }
  setSync(); renderAll();
  db.doc("plan/sahneler").onSnapshot((snap) => {
    if (dirty.has("scenes")) return;
    state.scenes = normScenes(snap.exists ? snap.data().list : []);
    applyPreferred(); renderAll();
  }, onDbError);
  db.doc("plan/oda").onSnapshot((snap) => {
    if (dirty.has("room")) return;
    if (snap.exists) { state.room = normRoom(snap.data()); renderAll(); }
  }, onDbError);
  db.collection("esyalar").onSnapshot((snap) => {
    const next = new Map();
    for (const d of snap.docs) {
      const key = "item:" + d.id;
      if (dirty.has(key) || dragId === d.id) { if (state.items.has(d.id)) next.set(d.id, state.items.get(d.id)); }
      else next.set(d.id, normItem(d.id, d.data()));
    }
    for (const key of dirty) {
      if (!key.startsWith("item:")) continue;
      const id = key.slice(5);
      if (!next.has(id) && state.items.has(id)) next.set(id, state.items.get(id));

/* ---------- mutations ---------- */

  const it = normItem(id, { kind, name: K.label, x: state.room.w / 2, y: state.room.l / 2, created: Date.now(), scene: state.scene });
  state.items.set(id, it); state.sel = id;
  saveSoon("item:" + id, 0); renderAll();
}
function duplicate(id) {
  const src = state.items.get(id); if (!src) return;
  const nid = newId();
  state.items.set(nid, normItem(nid, { ...src, name: src.name + " (kopya)", x: src.x + 20, y: src.y + 20, created: Date.now() }));
  state.sel = nid; saveSoon("item:" + nid, 0); renderAll();
}
function remove(id) {
  state.items.delete(id); if (state.sel === id) state.sel = null;
  saveSoon("item:" + id, 0); renderAll();
}
function pickScene(id) {
  if (!state.scenes.some((x) => x.id === id)) id = "mevcut";
  if (state.scene !== id) { state.scene = id; state.sel = null; }
  $("#scene").innerHTML = state.scenes.map((x) => `<option value="${esc(x.id)}" ${x.id === id ? "selected" : ""}>${esc(x.name)}</option>`).join("");
}
function createScene() {
  if (state.readOnly) return toast("Bu planı düzenleme iznin yok.");
  const id = "t" + Date.now().toString(36);
  const n = state.scenes.filter((x) => x.id !== "mevcut").length + 1;
  const src = sortedItems(), base = Date.now();
  state.scenes.push({ id, name: "Taslak " + n });
  src.forEach((it, i) => {
    const nid = newId() + i;
    state.items.set(nid, normItem(nid, { ...it, scene: id, created: base + i }));
    saveSoon("item:" + nid, 0);
  });
  saveSoon("scenes", 0);

  toast(`“Taslak ${n}” oluşturuldu. Değişiklikler yalnızca bu taslağı etkiler.`);
}
function deleteScene() {
  const id = state.scene; if (id === "mevcut") return;
  for (const it of [...state.items.values()]) if (it.scene === id) { state.items.delete(it.id); saveSoon("item:" + it.id, 0); }
  state.scenes = state.scenes.filter((x) => x.id !== id);

}
function select(id) {

}

const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : "https://" + u.replace(/^[a-z]+:/i, "");

/* ---------- render: plan svg ---------- */
const svg = $("#plan");
const T = 12;
let svgScale = 1;
function renderPlan() {
  const { w: W, l: L } = state.room;
  const r = svg.getBoundingClientRect();
  let M = 46;
  // margin must fit the wall plus the dimension labels, which are sized in screen pixels
  if (r.width > 0) for (let i = 0; i < 3; i++) M = T + 36 / Math.min(r.width / (W + 2 * M), r.height / (L + 2 * M));
  const vbW = W + 2 * M, vbH = L + 2 * M;
  svg.setAttribute("viewBox", `${-M} ${-M} ${vbW} ${vbH}`);
  svgScale = r.width > 0 ? Math.min(r.width / vbW, r.height / vbH) : 1.4;
  const px = (p) => p / svgScale;
  const fs = px(11.5), fsS = px(10), sw = px(1);
  const warn = state.warn || new Map();
  let h = `<defs>
    <pattern id="g10" width="10" height="10" patternUnits="userSpaceOnUse"><path class="g-minor" stroke-width="${sw}" d="M10 0H0V10"/></pattern>
    <pattern id="g50" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#g10)"/><path class="g-major" stroke-width="${sw}" d="M50 0H0V50"/></pattern>
  </defs>
  <rect class="floor" x="0" y="0" width="${W}" height="${L}"/>
  <rect x="0" y="0" width="${W}" height="${L}" fill="url(#g50)"/>`;

  // door swing zones
  for (const o of state.room.openings) if (o.type === "kapi" && o.swing !== "dis") h += `<polygon class="door-zone" points="${doorZone(o).map((p) => p.join(",")).join(" ")}"/>`;

  // items (rugs first, then by elevation)
  const items = sortedItems().sort((a, b) => (b.kind === "hali") - (a.kind === "hali") || a.elev - b.elev);
  for (const it of items) {
    const cls = ["item", it.kind === "hali" ? "rug" : "", it.elev >= 30 && it.kind !== "petek" ? "wallmount" : "", warn.has(it.id) ? "warn" : "", state.sel === it.id ? "sel" : "", dragId === it.id ? "dragging" : ""].join(" ");
    const hw = it.w / 2, hd = it.d / 2;
    const bodySw = state.sel === it.id ? px(2.5) : warn.has(it.id) ? px(2) : px(1.2);
    h += `<g class="${cls}" data-id="${esc(it.id)}" transform="translate(${it.x} ${it.y}) rotate(${it.rot})">
      <rect class="body" x="${-hw}" y="${-hd}" width="${it.w}" height="${it.d}" rx="${Math.min(2, hw, hd)}" fill="${esc(it.color)}" stroke-width="${bodySw}"/>
      ${planDetail(it, sw)}
      ${it.kind !== "hali" ? `<line class="front" x1="${-hw * 0.35}" y1="${hd - px(3)}" x2="${hw * 0.35}" y2="${hd - px(3)}" stroke-width="${px(2)}"/>` : ""}
    </g>`;
  }

  // walls with openings
  const fr = { ust: [0, -T, 1], alt: [0, L, 1], sol: [-T, 0, 0], sag: [W, 0, 0] };
  for (const wall of Object.keys(WALLS)) {
    const f = wallFrame(wall), [ox, oy, horiz] = fr[wall];
    const ops = state.room.openings.filter((o) => o.wall === wall);
    for (const [a, b] of wallSegments(f.len, ops)) {
      h += horiz ? `<rect class="wall" x="${a}" y="${oy}" width="${b - a}" height="${T}"/>` : `<rect class="wall" x="${ox}" y="${a}" width="${T}" height="${b - a}"/>`;
    }
    for (const o of ops) {

      if (o.type === "pencere") {
        if (horiz) h += `<rect class="win-fill" x="${a}" y="${oy}" width="${b - a}" height="${T}"/><path class="win-line" stroke-width="${px(1.2)}" d="M${a} ${oy}H${b}V${oy + T}H${a}ZM${a} ${oy + T / 2}H${b}"/>`;
        else h += `<rect class="win-fill" x="${ox}" y="${a}" width="${T}" height="${b - a}"/><path class="win-line" stroke-width="${px(1.2)}" d="M${ox} ${a}V${b}H${ox + T}V${a}ZM${ox + T / 2} ${a}V${b}"/>`;
      } else if (o.swing === "dis") {
        // opens away from the room: mark the opening only, nothing to keep clear inside
        const P = (t, k) => [f.o[0] + f.a[0] * t - f.n[0] * k, f.o[1] + f.a[1] * t - f.n[1] * k];

function planDetail(it, sw) {

              <line class="detail" stroke-width="${sw}" x1="${-hw}" y1="${-hd + it.d * 0.36}" x2="${hw}" y2="${-hd + it.d * 0.36}"/>`;
    }
    case "gardirop": case "tv": case "komodin": {
      const n = Math.max(1, Math.round(it.w / (it.kind === "komodin" ? 100 : 50)));
      let s = ""; for (let i = 1; i < n; i++) { const x = -hw + it.w * i / n; s += `<line class="detail" stroke-width="${sw}" x1="${x}" y1="${hd - 6}" x2="${x}" y2="${hd}"/>`; }

    }

    case "sandalye": return `<rect class="detail" stroke-width="${sw}" x="${-hw * 0.8}" y="${-hd}" width="${it.w * 0.8}" height="${Math.min(8, it.d * 0.15)}" rx="2"/>`;
    case "lamba": return `<circle class="detail" stroke-width="${sw}" r="${Math.min(hw, hd) * 0.6}"/>`;
    case "kask": return `<ellipse class="detail-fill" stroke-width="${sw}" rx="${hw * 0.85}" ry="${hd * 0.75}"/>`;
    case "ekran": return `<line class="detail" stroke-width="${sw}" x1="${-hw + 4}" y1="${hd - 2}" x2="${hw - 4}" y2="${hd - 2}"/>`;
    case "camdolap": {
      const n = Math.max(1, Math.round(it.w / 50));
      let s = ""; for (let i = 1; i < n; i++) { const x = -hw + it.w * i / n; s += `<line class="detail" stroke-width="${sw}" x1="${x}" y1="${hd - 6}" x2="${x}" y2="${hd}"/>`; }
      return s + `<line class="detail" stroke-width="${sw * 1.5}" stroke-dasharray="3 2" x1="${-hw}" y1="${hd - 3}" x2="${hw}" y2="${hd - 3}"/>`;

    case "masa": return `<rect class="detail" stroke-width="${sw}" x="${-hw + 3}" y="${-hd + 3}" width="${Math.max(0, it.w - 6)}" height="${Math.max(0, it.d - 6)}"/>`;

/* ---------- plan interaction ---------- */
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const m = svg.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 };
}
let drag = null;
svg.addEventListener("pointerdown", (e) => {
  const g = e.target.closest("[data-id]");
  if (!g) { if (state.sel) { state.sel = null; renderList(); renderPlan(); renderInspector(); scene3d.mark(); } return; }
  const id = g.dataset.id, it = state.items.get(id);
  select(id);
  if (state.readOnly || !it) return;
  const p = svgPoint(e);
  drag = { id, dx: p.x - it.x, dy: p.y - it.y, moved: false, sx: e.clientX, sy: e.clientY };
  svg.setPointerCapture(e.pointerId);
  e.preventDefault();
});
svg.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const it = state.items.get(drag.id); if (!it) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 3) return;
  drag.moved = true; dragId = drag.id;
  const p = svgPoint(e);
  placeSnapped(it, p.x - drag.dx, p.y - drag.dy, !e.altKey);
  state.warn = computeWarnings();
  renderPlan(); scene3d.mark(true);
});
const endDrag = () => {
  if (!drag) return;
  const { id, moved } = drag; drag = null; dragId = null;
  if (moved) { saveSoon("item:" + id, 0); renderAll(); renderInspector(); }
};
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);

function placeSnapped(it, x, y, snap) {
  const { w: W, l: L } = state.room;
  if (snap) { x = Math.round(x); y = Math.round(y); }
  it.x = x; it.y = y;
  if (!snap) return;
  const b = bbox(corners(it)), S = 8 / Math.max(svgScale, 0.3) ;
  const tol = clamp(S, 4, 14);
  if (Math.abs(b.x0) < tol) it.x -= b.x0; else if (Math.abs(W - b.x1) < tol) it.x += W - b.x1;
  if (Math.abs(b.y0) < tol) it.y -= b.y0; else if (Math.abs(L - b.y1) < tol) it.y += L - b.y1;
  // snap edges to other furniture edges
  const nb = bbox(corners(it));
  for (const o of sortedItems()) {
    if (o.id === it.id || o.kind === "hali") continue;
    const ob = bbox(corners(o));
    const overlapY = nb.y0 < ob.y1 && ob.y0 < nb.y1, overlapX = nb.x0 < ob.x1 && ob.x0 < nb.x1;
    if (overlapY) {
      if (Math.abs(nb.x0 - ob.x1) < tol) { it.x += ob.x1 - nb.x0; break; }
      if (Math.abs(ob.x0 - nb.x1) < tol) { it.x += ob.x0 - nb.x1; break; }
    }
    if (overlapX) {
      if (Math.abs(nb.y0 - ob.y1) < tol) { it.y += ob.y1 - nb.y0; break; }
      if (Math.abs(ob.y0 - nb.y1) < tol) { it.y += ob.y0 - nb.y1; break; }
    }
  }
  it.x = r1(it.x); it.y = r1(it.y);
}

document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.matches("input, textarea, select") || t.isContentEditable)) return;
  const it = state.items.get(state.sel); if (!it || state.readOnly) return;
  const step = e.shiftKey ? 10 : 1;
  const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (moves[e.key]) { it.x += moves[e.key][0]; it.y += moves[e.key][1]; e.preventDefault(); }
  else if (e.key === "r" || e.key === "R") { it.rot = (it.rot + (e.shiftKey ? 270 : 90)) % 360; }
  else if (e.key === "Escape") { select(null); return; }
  else return;
  saveSoon("item:" + it.id); renderAll(); renderInspector();
});

            for (let k = 1; k <= shelves; k++) {
              const y = th + (H - 2 * th) * k / (shelves + 1);
              bx(g, sec - 0.02, 0.016, D - 0.06, c, x0 + sec / 2, y, -0.01);
              bx(g, sec * 0.7, 0.12, D * 0.5, clothes[(i + k) % clothes.length], x0 + sec / 2, y + 0.016, 0, { emissive: "#3a3326", emissiveIntensity: 0.25 });
            }
          }
          // smoked glass door
          const door = bx(g, sec - 0.006, H - 2 * th - 0.004, 0.006, "#15171b", x0 + sec / 2, th + 0.002, D / 2 - 0.003, { transparent: true, opacity: 0.42, roughness: 0.05, metalness: 0.4 });
          door.castShadow = false;
          bx(g, 0.012, Math.min(0.5, H * 0.25), 0.02, "#2a2c30", x0 + (i % 2 ? 0.03 : sec - 0.03), H * 0.45, D / 2 + 0.01, { metalness: 0.7, roughness: 0.3 });
        }
        break;
      }
      case "petek": {
        const n = Math.max(2, Math.min(60, Math.round(W / 0.05)));
        for (let i = 0; i < n; i++) bx(g, W / n - 0.008, H, D, c, -W / 2 + W * (i + 0.5) / n, 0, 0);
        break;
      }
      default: bx(g, W, H, D, c, 0, 0, 0);
    }
    g.position.set(S(it.x - state.room.w / 2), S(it.elev), S(it.y - state.room.l / 2));
    g.rotation.y = -it.rot * Math.PI / 180;
    g.userData.id = it.id;
    g.traverse((o) => { o.userData.id = it.id; });
    return g;
  }

  function buildItems() {
    disposeGroup(itemsG);
    for (const it of sortedItems()) itemsG.add(buildItem(it));
    if (selHelper) { scene.remove(selHelper); selHelper.geometry.dispose(); selHelper = null; }
    const sg = itemsG.children.find((g) => g.userData.id === state.sel);
    if (sg) { selHelper = new THREE.BoxHelper(sg, new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--sel").trim() || "#e9a514")); scene.add(selHelper); }
  }

  function cam(mode) {
    camMode = mode || camMode;
    const R = state.room, W = S(R.w), L = S(R.l), H = S(R.h), span = Math.max(W, L);
    if (camMode === "ust") { camera.position.set(0, span * 1.9 + H, 0.001); controls.target.set(0, 0, 0); }
    else if (camMode === "kapi") {
      const d = R.openings.find((o) => o.type === "kapi") || { wall: "alt", offset: R.w / 2 - 40, width: 80 };
      const f = wallFrame(d.wall), mid = d.offset + d.width / 2;
      const px = f.o[0] + f.a[0] * mid + f.n[0] * 25, py = f.o[1] + f.a[1] * mid + f.n[1] * 25;
      camera.position.set(S(px - R.w / 2), 1.6, S(py - R.l / 2));
      controls.target.set(S(px + f.n[0] * 200 - R.w / 2) * 0.5, 0.9, S(py + f.n[1] * 200 - R.l / 2) * 0.5);
    } else { camera.position.set(W * 0.85 + 0.6, H + span * 0.9, L * 0.95 + 0.9); controls.target.set(0, 0.6, 0); }
    controls.update(); needFrame = true;
    document.querySelectorAll("[data-cam]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cam === camMode));
  }

  function resize() {
    const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); needFrame = true;
  }
  new ResizeObserver(resize).observe(host);

  function loop() {
    requestAnimationFrame(loop);
    if (!host.clientWidth) return;
    if (dirtyRoom) {
      const key = JSON.stringify(state.room);
      if (key !== roomKey) { const first = !roomKey; roomKey = key; buildRoom(); if (first) cam("genel"); }
      dirtyRoom = false; needFrame = true;
    }
    if (dirtyItems) { buildItems(); dirtyItems = false; needFrame = true; }
    const moved = controls.update();
    const R = state.room, hw = S(R.w) / 2, hl = S(R.l) / 2, p = camera.position;
    if (walls.ust) {
      walls.ust.visible = p.z > -hl - 0.05; walls.alt.visible = p.z < hl + 0.05;
      walls.sol.visible = p.x > -hw - 0.05; walls.sag.visible = p.x < hw + 0.05;
    }
    if (moved || needFrame) { scene.background = new THREE.Color(bgColor()); renderer.render(scene, camera); needFrame = false; }
  }
  controls.addEventListener("change", () => { needFrame = true; });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { needFrame = true; dirtyItems = true; });

  // click to select
  const ray = new THREE.Raycaster(); let down = null;
  renderer.domElement.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener("pointerup", (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) { down = null; return; }
    down = null;
    const r = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera({ x: (e.clientX - r.left) / r.width * 2 - 1, y: -(e.clientY - r.top) / r.height * 2 + 1 }, camera);
    const hit = ray.intersectObjects(itemsG.children, true)[0];
    select(hit ? hit.object.userData.id : null);
  });
  document.querySelectorAll("[data-cam]").forEach((b) => b.addEventListener("click", () => cam(b.dataset.cam)));
  requestAnimationFrame(loop);
  return {
    mark(all) { dirtyItems = true; if (all) dirtyRoom = true; needFrame = true; },
    resize, cam,
  };
})();

/* ---------- boot ---------- */
try { const v = localStorage.getItem(LS_KEY + "-view"); if (v && ["plan", "3d", "both"].includes(v)) { state.view = v; $("#views").dataset.view = v; document.querySelectorAll("[data-view]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.view === v)); } } catch (e) { /* ignore */ }
try { preferredScene = localStorage.getItem(LS_KEY + "-scene"); } catch (e) { /* ignore */ }
pickScene("mevcut");
renderLib();
renderAll();
new ResizeObserver(() => renderPlan()).observe(svg);
startStore();
})();
</script>
